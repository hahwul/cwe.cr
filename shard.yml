name: cwe
version: 0.1.0
description: |
  A Crystal implementation of the MITRE CWE (Common Weakness Enumeration).
  The full CWE Research view (view 1000) is embedded at compile time —
  lookups, search, and relationship traversal need no network access or
  sidecar data files.

authors:
  - hahwul <hahwul@gmail.com>

crystal: '>= 1.20.2'

license: MIT

repository: https://github.com/hahwul/cwe.cr
homepage: https://github.com/hahwul/cwe.cr
documentation: https://github.com/hahwul/cwe.cr
